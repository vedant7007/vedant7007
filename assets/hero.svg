<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Vedant Idlgave. Full-stack developer and GenAI builder from Hyderabad.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A12"/>
      <stop offset="1" stop-color="#0F0E1C"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#B9B3FF"/>
      <stop offset="0.5" stop-color="#7DE2FF"/>
      <stop offset="0.65" stop-color="#B9B3FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <clipPath id="type"><rect x="72" y="200" width="0" height="44">
      <animate attributeName="width" values="0;690;690;0" keyTimes="0;0.35;0.85;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, Menlo, monospace; }
    .blob-a { animation: driftA 14s ease-in-out infinite alternate; }
    .blob-b { animation: driftB 18s ease-in-out infinite alternate; }
    .blob-c { animation: driftC 16s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-140px,-30px); } }
    @keyframes driftC { from { transform: translate(0,0); } to { transform: translate(60px,-60px); } }
    .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; } .d5 { animation-delay: 1.1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .spin   { transform-origin: 960px 190px; animation: spin 40s linear infinite; }
    .spin-r { transform-origin: 960px 190px; animation: spin 26s linear infinite reverse; }
    .spin-f { transform-origin: 960px 190px; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 960px 190px; animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: .5; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="blob-a" cx="180" cy="60" r="160" fill="#6C63FF"/>
      <circle class="blob-b" cx="1050" cy="330" r="170" fill="#22D3EE" opacity="0.6"/>
      <circle class="blob-c" cx="620" cy="380" r="140" fill="#C084FC" opacity="0.5"/>
    </g>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- orbit rings -->
    <g opacity="0.9">
      <circle class="pulse" cx="960" cy="190" r="34" fill="#6C63FF" opacity="0.25"/>
      <circle cx="960" cy="190" r="6" fill="#FFFFFF"/>
      <g class="spin">
        <circle cx="960" cy="190" r="140" fill="none" stroke="url(#ring)" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2 10"/>
        <circle cx="1100" cy="190" r="5" fill="#22D3EE"/>
      </g>
      <g class="spin-r">
        <circle cx="960" cy="190" r="104" fill="none" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="60 18 4 18"/>
        <circle cx="960" cy="86" r="4" fill="#B9B3FF"/>
      </g>
      <g class="spin-f">
        <circle cx="960" cy="190" r="68" fill="none" stroke="url(#ring)" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="120 300"/>
        <polygon points="960,140 1003,215 917,215" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
      </g>
    </g>

    <!-- text -->
    <g class="rise d1">
      <text x="72" y="92" class="mono" font-size="16" fill="#8B8AA8" letter-spacing="3">HEY THERE, I'M</text>
    </g>
    <g class="rise d2">
      <text x="68" y="166" class="sans" font-size="72" font-weight="800" fill="url(#name)" letter-spacing="-2">Vedant Idlgave</text>
    </g>
    <g class="rise d3">
      <g clip-path="url(#type)">
        <text x="72" y="230" class="mono" font-size="24" fill="#E6E6F0">
          <tspan fill="#6C63FF">&gt;</tspan> full-stack dev · genai builder · open source
        </text>
      </g>
      <rect class="caret" x="72" y="208" width="12" height="28" fill="#22D3EE" opacity="0.9">
        <animate attributeName="x" values="72;754;754;72" keyTimes="0;0.35;0.85;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- pills -->
    <g class="rise d4 sans" font-size="14" font-weight="600">
      <rect x="72" y="278" width="168" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="94" cy="296" r="4" fill="#22D3EE"/>
      <text x="108" y="301" fill="#D4D4E4">Hyderabad, IN</text>

      <rect x="252" y="278" width="214" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="274" cy="296" r="4" fill="#B9B3FF"/>
      <text x="288" y="301" fill="#D4D4E4">B.Tech CSE @ VJIT '28</text>

      <rect x="478" y="278" width="252" height="36" rx="18" fill="#6C63FF" fill-opacity="0.18" stroke="#6C63FF" stroke-opacity="0.5"/>
      <circle cx="500" cy="296" r="4" fill="#FFB86B"/>
      <text x="514" y="301" fill="#FFFFFF">Tech Lead @ AWS SBG VJIT</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
