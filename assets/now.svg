<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Right now: Leading the tech side of AWS Student Community Day at VJIT; Building a 3D portfolio with React Three Fiber and GLSL; Shipping multi-agent systems with Gemini and MCP; Contributing to open source through GSSoC 2026.">
  <defs>
    <style>
      @font-face { font-family: "BSD"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 900; }
      @font-face { font-family: "AH"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 700; }
      .d { font-family: "BSD", "Arial Narrow", sans-serif; font-weight: 900; }
      .b7 { font-family: "AH", Verdana, sans-serif; font-weight: 700; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
      @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(3); opacity: 0; } }
      .drift { animation: drift 18s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
      @media (prefers-reduced-motion: reduce) { .ring, .drift { animation: none; } }
    </style>
    <clipPath id="c"><rect width="1200" height="330" rx="24"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#101A33" fill-opacity="0.12"/></pattern>
    <linearGradient id="holo" x1="0" y1="0" x2="0.6" y2="0.6" spreadMethod="reflect"><stop offset="0" stop-color="#38BDF8"><animate attributeName="stop-color" values="#38BDF8;#7DD3FC;#A78BFA;#F472B6;#FBBF24;#34D399;#38BDF8" dur="14s" begin="0.00s" repeatCount="indefinite"/></stop><stop offset="0.5" stop-color="#38BDF8"><animate attributeName="stop-color" values="#38BDF8;#7DD3FC;#A78BFA;#F472B6;#FBBF24;#34D399;#38BDF8" dur="14s" begin="-4.67s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#38BDF8"><animate attributeName="stop-color" values="#38BDF8;#7DD3FC;#A78BFA;#F472B6;#FBBF24;#34D399;#38BDF8" dur="14s" begin="-9.33s" repeatCount="indefinite"/></stop><animateTransform attributeName="gradientTransform" type="translate" values="0 0;2 0" dur="12s" repeatCount="indefinite"/></linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="330" fill="url(#holo)"/>
    <rect class="drift" x="0" y="0" width="1440" height="330" fill="url(#dots)"/>
    <text x="56" y="96" class="d" font-size="56" fill="#101A33">Right now</text>
    <circle class="ring" style="animation-delay:0.0s" cx="64" cy="153" r="6" fill="none" stroke="#101A33" stroke-width="2"/><circle cx="64" cy="153" r="6" fill="#101A33"/><text x="90" y="160" class="b7" font-size="22" fill="#101A33"><tspan x="90" dy="0">Leading the tech side of AWS Student</tspan><tspan x="90" dy="30">Community Day at VJIT</tspan></text><circle class="ring" style="animation-delay:0.6s" cx="64" cy="237" r="6" fill="none" stroke="#101A33" stroke-width="2"/><circle cx="64" cy="237" r="6" fill="#101A33"/><text x="90" y="244" class="b7" font-size="22" fill="#101A33"><tspan x="90" dy="0">Building a 3D portfolio with React</tspan><tspan x="90" dy="30">Three Fiber and GLSL</tspan></text><circle class="ring" style="animation-delay:1.2s" cx="624" cy="153" r="6" fill="none" stroke="#101A33" stroke-width="2"/><circle cx="624" cy="153" r="6" fill="#101A33"/><text x="650" y="160" class="b7" font-size="22" fill="#101A33"><tspan x="650" dy="0">Shipping multi-agent systems with</tspan><tspan x="650" dy="30">Gemini and MCP</tspan></text><circle class="ring" style="animation-delay:1.7999999999999998s" cx="624" cy="237" r="6" fill="none" stroke="#101A33" stroke-width="2"/><circle cx="624" cy="237" r="6" fill="#101A33"/><text x="650" y="244" class="b7" font-size="22" fill="#101A33"><tspan x="650" dy="0">Contributing to open source through</tspan><tspan x="650" dy="30">GSSoC 2026</tspan></text>
    <rect x="0" y="322" width="1200" height="8" fill="#101A33"/>
  </g>
</svg>
