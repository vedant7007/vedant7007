<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="What I am doing right now: building a cinematic 3D portfolio, leading AWS Student Community Day at VJIT, shipping multi-agent systems, contributing to open source.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="300" rx="22"/></clipPath>
    <clipPath id="l1"><rect x="40" y="96" width="0" height="34"><animate attributeName="width" values="0;0;1120" keyTimes="0;0.02;1" dur="1.6s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="136" width="0" height="34"><animate attributeName="width" values="0;1120" dur="1.6s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="176" width="0" height="34"><animate attributeName="width" values="0;1120" dur="1.6s" begin="3.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="216" width="0" height="34"><animate attributeName="width" values="0;1120" dur="1.6s" begin="5.1s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, Menlo, monospace; }
    .k { fill: #22D3EE; } .v { fill: #E6E6F0; } .p { fill: #6C63FF; } .m { fill: #6E6D88; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sweep { stroke-dasharray: 300 2700; animation: sweep 6s linear infinite; }
    @keyframes sweep { to { stroke-dashoffset: -3000; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="#0B0B14"/>
    <rect width="1200" height="52" fill="#FFFFFF" fill-opacity="0.03"/>
    <circle cx="32" cy="26" r="7" fill="#FF5F57"/>
    <circle cx="56" cy="26" r="7" fill="#FEBC2E"/>
    <circle cx="80" cy="26" r="7" fill="#28C840"/>
    <text x="600" y="31" text-anchor="middle" class="mono" font-size="14" fill="#6E6D88">vedant@hyderabad: ~/now</text>

    <g class="mono" font-size="20">
      <text x="40" y="84" class="m">$ cat now.log</text>
      <g clip-path="url(#l1)"><text x="40" y="122"><tspan class="p">&gt; </tspan><tspan class="k">building   </tspan><tspan class="v">a cinematic 3D portfolio with R3F, GSAP and GLSL shaders</tspan></text></g>
      <g clip-path="url(#l2)"><text x="40" y="162"><tspan class="p">&gt; </tspan><tspan class="k">leading    </tspan><tspan class="v">AWS Student Community Day @ VJIT as Tech Lead, AWS SBG</tspan></text></g>
      <g clip-path="url(#l3)"><text x="40" y="202"><tspan class="p">&gt; </tspan><tspan class="k">shipping   </tspan><tspan class="v">multi-agent systems with Gemini, Claude and MCP</tspan></text></g>
      <g clip-path="url(#l4)"><text x="40" y="242"><tspan class="p">&gt; </tspan><tspan class="k">hunting    </tspan><tspan class="v">hackathons, open source and SDE internships</tspan></text></g>
      <rect class="caret" x="40" y="258" width="11" height="22" fill="#22D3EE"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect class="sweep" x="1" y="1" width="1198" height="298" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
